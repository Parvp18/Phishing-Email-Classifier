<!DOCTYPE html>
<html>
<head>
    <title>PhishGuard</title>
    <style>
        body { font-family: 'Inter', sans-serif; width: 300px; padding: 15px; margin: 0; background: #0a0b0f; color: #f1f5f9; }
        h3 { margin-top: 0; border-bottom: 1px solid #1e2130; padding-bottom: 10px; color: #6c63ff; }
        .setting { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 12px; color: #64748b; }
        input[type="text"] { width: 100%; box-sizing: border-box; padding: 6px; background: #12141c; border: 1px solid #1e2130; color: #fff; border-radius: 4px; }
        button { background: #6c63ff; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #5a52d6; }
        
        .result-box { margin-top: 15px; padding: 10px; border-radius: 4px; background: #12141c; border: 1px solid #1e2130; font-size: 12px; }
        .phishing { border-color: #ef4444; color: #ef4444; }
        .safe { border-color: #22c55e; color: #22c55e; }
    </style>
</head>
<body>
    <h3>🛡️ PhishGuard</h3>
    
    <div class="setting">
        <label><input type="checkbox" id="enabled_toggle"> Enable Gmail Auto-Scan</label>
    </div>
    
    <div class="setting">
        <label>API Endpoint</label>
        <input type="text" id="endpoint_input">
    </div>
    
    <div class="setting">
        <label>API Key</label>
        <input type="text" id="apikey_input">
    </div>
    
    <button id="save_btn">Save Settings</button>
    <div id="save_msg" style="color: #22c55e; font-size: 12px; display: none; text-align: center; margin-top: 5px;">Saved!</div>

    <div id="last_scan" class="result-box" style="display:none;">
        <div style="font-weight:bold; margin-bottom:5px;">Last Scan Result:</div>
        <div id="scan_label" style="font-size: 14px; font-weight: bold;"></div>
        <div id="scan_conf"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggle = document.getElementById('enabled_toggle');
            const endpoint = document.getElementById('endpoint_input');
            const apikey = document.getElementById('apikey_input');
            const saveBtn = document.getElementById('save_btn');
            const saveMsg = document.getElementById('save_msg');
            
            // Load
            chrome.storage.local.get(['phishguard_enabled', 'phishguard_endpoint', 'phishguard_api_key', 'last_scan'], (res) => {
                toggle.checked = res.phishguard_enabled !== false;
                endpoint.value = res.phishguard_endpoint || "http://localhost:5000/api/analyze";
                apikey.value = res.phishguard_api_key || "";
                
                if (res.last_scan) {
                    const box = document.getElementById('last_scan');
                    const lbl = document.getElementById('scan_label');
                    box.style.display = 'block';
                    lbl.innerText = res.last_scan.label;
                    lbl.className = res.last_scan.label === 'PHISHING' ? 'phishing' : 'safe';
                    document.getElementById('scan_conf').innerText = `${res.last_scan.confidence}% Confidence`;
                }
            });
            
            // Save
            saveBtn.addEventListener('click', () => {
                chrome.storage.local.set({
                    phishguard_enabled: toggle.checked,
                    phishguard_endpoint: endpoint.value,
                    phishguard_api_key: apikey.value
                }, () => {
                    saveMsg.style.display = 'block';
                    setTimeout(() => saveMsg.style.display = 'none', 2000);
                });
            });
        });
    </script>
</body>
</html>
