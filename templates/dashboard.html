<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard - Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <img src="{{ url_for('static', filename='icons/shield.svg') }}" alt="Shield" width="24" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%234f46e5\'><path d=\'M12 2L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-3zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-2.33v8.02z\'/></svg>'">
            PhishGuard
        </div>
        <ul class="nav-links">
            <li><a href="/">Analyzer</a></li>
            <li><a href="/dashboard" class="active">Dashboard</a></li>
            <li><a href="/history">History</a></li>
        </ul>
        <div style="margin-top: auto;">
            <div class="model-status">
                <div class="status-dot"></div>
                Model v{{ version }} active
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <h1>Analytics Dashboard</h1>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">System-wide statistics and threat trends.</p>

        <!-- Metrics Row -->
        <div class="models-row" style="margin-bottom: 2rem;">
            <div class="card model-card">
                <div class="model-name">Total Scans</div>
                <div id="stat_total" class="model-conf" style="font-size: 2rem;">--</div>
            </div>
            <div class="card model-card">
                <div class="model-name">Phishing Detected</div>
                <div id="stat_phishing" class="model-conf" style="font-size: 2rem; color: var(--danger);">--</div>
            </div>
            <div class="card model-card">
                <div class="model-name">Safe Detected</div>
                <div id="stat_safe" class="model-conf" style="font-size: 2rem; color: var(--success);">--</div>
            </div>
            <div class="card model-card">
                <div class="model-name">Avg Confidence</div>
                <div id="stat_conf" class="model-conf" style="font-size: 2rem; color: var(--accent);">--%</div>
            </div>
        </div>

        <!-- Charts Grid -->
        <div class="analysis-grid">
            <div class="card">
                <h3 style="margin-bottom: 1rem;">Daily Scan Volume (Last 30 Days)</h3>
                <div style="height: 300px;">
                    <canvas id="lineChart"></canvas>
                </div>
            </div>
            <div class="card">
                <h3 style="margin-bottom: 1rem;">Top Attack Types</h3>
                <div style="height: 300px; display: flex; justify-content: center;">
                    <canvas id="donutChart"></canvas>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_KEY = "your-secret-key-1";

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/stats', { headers: { 'X-API-Key': API_KEY } });
                const data = await res.json();
                
                document.getElementById('stat_total').textContent = data.total_scans;
                document.getElementById('stat_phishing').textContent = data.phishing_detected;
                document.getElementById('stat_safe').textContent = data.safe_detected;
                document.getElementById('stat_conf').textContent = data.avg_confidence + '%';

                renderLineChart(data.daily_counts);
                renderDonutChart(data.top_attack_types);
            } catch (e) {
                console.error("Failed to load stats", e);
            }
        });

        function renderLineChart(dailyData) {
            const ctx = document.getElementById('lineChart');
            const dates = Object.keys(dailyData).sort();
            const phishing = dates.map(d => dailyData[d].PHISHING || 0);
            const safe = dates.map(d => dailyData[d].SAFE || 0);

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: dates,
                    datasets: [
                        { label: 'Phishing', data: phishing, backgroundColor: 'rgba(239, 68, 68, 0.8)' },
                        { label: 'Safe', data: safe, backgroundColor: 'rgba(34, 197, 94, 0.8)' }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        x: { stacked: true, grid: { color: '#e2e8f0' }, ticks: { color: '#475569' } },
                        y: { stacked: true, grid: { color: '#e2e8f0' }, ticks: { color: '#475569' } }
                    },
                    plugins: { legend: { labels: { color: '#0f172a', font: { weight: '600' } } } }
                }
            });
        }

        function renderDonutChart(attackTypes) {
            const ctx = document.getElementById('donutChart');
            const labels = Object.keys(attackTypes);
            const data = Object.values(attackTypes);

            // Filter out 'Unknown' if we want, or keep it
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: ['#dc2626', '#d97706', '#4f46e5', '#0d9488', '#64748b'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'right', labels: { color: '#0f172a', font: { weight: '600' } } } }
                }
            });
        }
    </script>
</body>
</html>
